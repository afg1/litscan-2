name: CI

# Only build when code or packaging changes. GitHub ignores `paths` for tag
# pushes, so every v* tag still builds and publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &code
      - 'src/**'
      - 'litscan_2/**'
      - 'tests/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/CI.yml'
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64 }
          - { runner: ubuntu-24.04, target: aarch64 }
          - { runner: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          LITSCAN_GIT_SHA: ${{ github.sha }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          docker-options: -e LITSCAN_GIT_SHA
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, no token secret
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: test "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
