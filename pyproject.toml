[build-system]
requires = ["maturin>=1.9,<2.0"]  # 1.9+ for PEP 639 license / license-files
build-backend = "maturin"

[project]
name = "litscan-2"
description = "Fast Aho-Corasick scanning of Europe PMC full text for millions of identifiers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "polars>=1.8.2",
    "tqdm>=4.67.3",
]

[project.urls]
Documentation = "https://afg1.github.io/litscan-2/"
Repository = "https://github.com/afg1/litscan-2"
[tool.maturin]
module-name = "litscan_2._core"
python-source = "."
features = ["pyo3/extension-module", "pyo3/abi3-py312"]
